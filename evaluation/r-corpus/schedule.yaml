# Counterbalanced assignment schedule — form A.
# Deterministic cyclic Latin square over the nine exact conditions (no RNG).
#
# v3 (pre-data correction): v2 assigned family presentation sequences in
# lockstep with the item rotation (list L(n) used sequence ((n-1) mod 3)+1),
# which made every item's WITHIN-BLOCK ordinal position constant across all
# nine lists (r-01/r-04/r-07 always first, r-03/r-06/r-09 always third).
# Item identity was perfectly confounded with practice/fatigue position.
# v3 decouples the two: list L(n) now uses sequence ((n-1)*2 mod 3)+1, so
# each item occupies each within-block position in exactly 3 of the 9 lists.
# Assignments are UNCHANGED from v2; only the family_sequence per list and
# the procedure text differ.
version: 3
form: a
procedure:
  construction: >-
    deterministic cyclic Latin square: the nine exact conditions are enumerated
    [day:restrained, day:balanced, day:expressive, evening:restrained,
    evening:balanced, evening:expressive, night:restrained, night:balanced,
    night:expressive]; list L(k+1) (k = 0..8) assigns item i (i = 0..8 for
    r-01..r-09) to condition (i + k) mod 9.
  rules:
  - 'each list is a bijection: 9 items onto the 9 exact conditions, every item
    exactly once and every condition exactly once'
  - across the nine lists every item meets every exact condition exactly once and every
    condition receives every item exactly once (item x condition is a Latin square; no
    RNG, no seed needed)
  - within a list each variant block (day / evening / night) contains each family exactly
    once
  - variant order is contextual (day before evening before night) per HUMAN_EVALUATION.md;
    cross-context checks are marked separately there
  - family presentation order within a variant block follows the balanced sequences of
    HUMAN_EVALUATION.md; list L(n) uses sequence (((n - 1) * 2) mod 3) + 1, deliberately
    NOT in lockstep with the item rotation (see the v3 note above)
  - 'position balance: across the nine lists every item sits at each within-block
    ordinal position (first / second / third timed trial) exactly three times, so item
    difficulty is not structurally confounded with within-session practice or fatigue'
  - 'easy excerpts are never permanently bound to one theme: the item<->condition
    pairing shifts by one condition in every successive list'
usage:
- 'one participant uses EXACTLY ONE list for all nine form-A trials (three scan
  sessions: day, evening, night); the lists counterbalance ACROSS PARTICIPANTS, not
  across repeat sessions'
- 'never hand a second form-A list to the same participant: they would repeat timed
  items; a repeat pass for the same participant requires the future disjoint forms B/C
  (manifest.yaml: forms), which do not exist yet'
lists:
- name: L1
  family_sequence: 1
  family_sequence_order: restrained -> balanced -> expressive
  variant_order: [day, evening, night]
  assignments:
    day:
      restrained: r-01-read-station-log
      balanced: r-02-signif-round
      expressive: r-03-threshold-check
    evening:
      restrained: r-04-rolling-window
      balanced: r-05-normalise-results
      expressive: r-06-canonicalise-id
    night:
      restrained: r-07-month-grid
      balanced: r-08-dominant-direction
      expressive: r-09-plot-with-band
- name: L2
