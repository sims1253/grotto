# Counterbalanced assignment schedule — form A.
# Generated by the deterministic rotation described in `procedure` (no RNG).
version: 1
form: a
procedure:
  construction: 'deterministic modular rotation: in list k (k=0,1,2), item i is assigned to condition
    slot (i+k) mod 9 over conditions [day:{a,b,c}, evening:{a,b,c}, night:{a,b,c}]'
  seed: 'none needed (deterministic rotation); recorded for audit anyway: schedule-a-v1'
  rules:
  - every list assigns each of the 9 items exactly once (bijection)
  - no participant repeats an item within a list, and one timed item is never repeated within a participant
  - across the three lists each item meets each family exactly once
  - family presentation order follows the balanced sequences of HUMAN_EVALUATION.md; list k uses sequence
    k+1
  - variant order is contextual (day before evening before night) per HUMAN_EVALUATION.md; cross-context
    checks are marked separately
  - 'easy excerpts are never permanently bound to one theme: item<->condition pairing shifts every list'
  limits: with one form (9 items) and 9 conditions each list gives every theme exactly one excerpt; pairing
    control comes from using all three lists across repeat sessions. Forms B/C extend this to 3x9.
lists:
- name: L1
  family_sequence: 1
  family_sequence_order: restrained -> balanced -> expressive
  variant_order: &id001
  - day
  - evening
  - night
  assignments:
    day:
      restrained: r-01-read-station-log
      balanced: r-02-signif-round
      expressive: r-03-threshold-check
    evening:
      restrained: r-04-rolling-window
      balanced: r-05-normalise-results
      expressive: r-06-canonicalise-id
    night:
      restrained: r-07-month-grid
      balanced: r-08-dominant-direction
      expressive: r-09-plot-with-band
- name: L2
  family_sequence: 2
  family_sequence_order: balanced -> expressive -> restrained
  variant_order: *id001
  assignments:
    day:
      balanced: r-01-read-station-log
      expressive: r-02-signif-round
      restrained: r-09-plot-with-band
    evening:
      restrained: r-03-threshold-check
      balanced: r-04-rolling-window
      expressive: r-05-normalise-results
    night:
      restrained: r-06-canonicalise-id
      balanced: r-07-month-grid
      expressive: r-08-dominant-direction
- name: L3
  family_sequence: 3
  family_sequence_order: expressive -> restrained -> balanced
  variant_order: *id001
  assignments:
    day:
      expressive: r-01-read-station-log
      restrained: r-08-dominant-direction
      balanced: r-09-plot-with-band
    evening:
      restrained: r-02-signif-round
      balanced: r-03-threshold-check
      expressive: r-04-rolling-window
    night:
      restrained: r-05-normalise-results
      balanced: r-06-canonicalise-id
      expressive: r-07-month-grid
