  source_note: 'The classic Monokai as shipped with VS Code (extensions/theme-monokai/themes/monokai-color-theme.json).
    This theme has no single named-palette file; the palette below is reconstructed verbatim from the
    theme JSON''s (a) header comment of base values, (b) editor/terminal `colors` map, and (c) `tokenColors`
    syntax rules. Roles are mapped from those same tokenColors rules (e.g. `string` -> #E6DB74, `keyword`/`storage`
    -> #F92672). Note: this is the open VS Code "Monokai", not the proprietary Monokai Pro.'
