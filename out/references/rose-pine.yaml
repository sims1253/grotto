schema: grotto.reference-analysis
schema_version: phase3
reference:
  name: rose-pine
  label: dark
  file_stem: ''
  source_url: https://raw.githubusercontent.com/rose-pine/palette/main/palette.json
  source_note: 'Palette roles (`base surface overlay muted subtle text love gold rose pine foam iris`)
    from rose-pine/palette `palette.json` (the built artifact), cross-checked against the official site
    rosepinetheme.com/palette. The `highlightLow/Med/High` values (alpha-overlay backgrounds used for
    selection/cursor) are NOT in palette.json; they come from `source/index.ts`, also cross-checked on
    the site. Role->color mapping is taken from the palette README "Roles" tables, which document each
    color''s usage. NOTE: the README accent table documents strings, functions, builtins, booleans, object
    keys, parameters, punctuation/operators, errors/warnings/info and git states, but does NOT assign
    keyword/type/number at the palette level (those are left to individual editor ports), so they are
    null below. NOTE: palette.json (and the website) give dawn `text` as #464261; the stale `source/index.ts`
    still shows the older #575279 -- #464261 is used here.'
