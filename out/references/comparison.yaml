schema: grotto.reference-comparison
schema_version: phase3
references:
- kanagawa
- monokai
- nord
- palenight
- rose-pine
- solarized
ordering_note: References are listed in a fixed alphabetical-by-file-stem order. This is NOT a ranking;
  no winner or 'best' theme is declared (DESIGN.md section 1).
comparison_basis: All metrics are computed on the dark (primary) variant of each reference, which is the
  only block all six share. Light/dawn variants present in some files are recorded under 'variant_ambiguity'
  but are NOT part of this comparison (mixing polarities would be a category error).
