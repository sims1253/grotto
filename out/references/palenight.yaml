  warm_hue_center_deg: 60.0
  achromatic_floor: 0.02
  chroma_weighted_score: 0.129069
  n_chromatic_roles: 15
  n_warm_roles: 7
  n_cool_roles: 8
  n_neutral_roles: 0
  warm_roles:
  - diff_added
  - diff_removed
  - error
  - number
  - string
  - type
  - warning
  cool_roles:
