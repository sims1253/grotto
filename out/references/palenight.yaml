    (no separate named-palette file), so the palette below is the set of distinct colors actually used
    by the theme, reconstructed verbatim from the JSON''s `colors` (UI) and `tokenColors` (syntax) maps.
    Roles are mapped from tokenColors scopes (e.g. `string` -> #C3E88D, `keyword`/`storage` -> #C792EA,
    `entity.name.function` -> #82AAFF) and from UI `colors` keys (editor.background, editorError.foreground,
    etc.).'
