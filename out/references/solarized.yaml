warm_cool_balance:
  definition: Palette score = sum(C_i * cos(h_i - 60deg)) / sum(C_i) over chromatic roles (C >= 0.02).
    +1 warm (amber), -1 cool (azure), 0 at 150/330 deg. A convention on OKLCH hue, not a perceptual law.
  warm_hue_center_deg: 60.0
  achromatic_floor: 0.02
  chroma_weighted_score: 0.216684
  n_chromatic_roles: 13
  n_warm_roles: 6
  n_cool_roles: 7
  warm_roles:
  - diff_added
  - diff_removed
  - error
  - keyword
  - type
  - warning
  cool_roles:
  - bg
  - comment
  - constant
