schema: grotto.reference-analysis
schema_version: phase3
reference:
  name: solarized
  label: dark
  file_stem: ''
  source_url: https://ethanschoonover.com/solarized/
  source_note: 'The 16-color palette is the canonical Solarized palette from ethanschoonover.com/solarized
    (the monotones base03..base3 + the 8 accents yellow/orange/red/magenta/violet/blue/cyan/green). Hex
    values were read from the site HTML and are identical to those defined in Ethan Schoonover''s official
    vim colorscheme (altercation/vim-colors-solarized). The canonical `green` is #859900 (the site value);
    note the vim file ships an "experimental" #719e07 override that is NOT used here. Solarized''s design
    is a single palette that serves both a dark and a light mode by swapping the monotone pairs (the website
    documents the base03:bg <-> base0:text and base02:highlight <-> base1 pairing), so both role mappings
    are recorded below. Syntax roles (keyword=green, string/number/constant=cyan, type=yellow, function=blue,
    ...) come from the official vim colorscheme''s standard group definitions.'
  is_primary: true
  source_ambiguous: true
  extra_variant_labels:
  - light
  normalized_alpha_roles: []
  roles_present_count: 15
  roles_missing_count: 25
  roles_missing:
  - active_line
  - bg_elevated
  - bg_overlay
  - breakpoint
  - builtin
  - debug_current
  - decorator
  - deprecated
  - diff_changed
  - docstring
  - fg_muted
  - focus
  - info
  - line_number
  - line_number_active
  - namespace
  - operator
  - parameter
  - property
  - punctuation
  - search_match
  - search_match_current
  - success
  - tag
  - ui_inactive
  roles_not_in_spec: []
  mapping_completeness:
    present: 15
    total_spec_roles: 40
    fraction: 0.375
background:
