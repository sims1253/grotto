    role: bg
    hex: '#002b36'
    L: 0.267337
    C: 0.048612
    h: 219.816892
    h_meaningful: true
    classification: cool
    achromatic_floor: 0.02
  bg_elevated: null
  bg_overlay: null
  note: Hue is suppressed (reported null, classification 'achromatic') when OKLCH chroma C < 0.02, because
    hue angle is noise near the achromatic axis (color.oklab_to_oklch). The warm/cool classification uses
    the same warm/cool convention documented under warm_cool_balance.
