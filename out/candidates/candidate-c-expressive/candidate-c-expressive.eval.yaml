      - &id002
        claim: Every syntax role gets a unique hue.
        reason: 'Produces rainbow highlighting, exhausts the perceptual budget, and degrades badly under
          CVD. We use ~5 hue families for ~14 syntax roles and spend the remainder on salience.

          '
      - &id003
        claim: Local variables should be coloured.
        reason: 'Most frequent token class, least informative distinction. Colouring them means the majority
          of chromatic pixels carry no information.

          '
      - &id004
        claim: All pairwise distances should be maximised.
        reason: 'Distance is zero-sum inside a bounded gamut. Maximising everything flattens the semantic
          structure that the grouping above encodes.

          '
      - &id005
        claim: Punctuation should match its enclosing construct.
        reason: 'Rainbow-bracket-style coding raises the noise floor across a major area class to disambiguate
          a structure that indentation already conveys.

          '
