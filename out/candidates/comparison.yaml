disagreement_log:
  purpose: Metrics and visual judgment WILL disagree. That disagreement is a finding, not a failure. Record
    it here; do not resolve it by massaging a threshold (DESIGN.md section 1).
  entries:
  - id: A-chroma-vs-flatness
    candidate: candidate-a-restrained
    metric_signal: lowest mean realized chroma, but the most night distance errors of the three candidates
    metric_prediction: lower chroma suggests lower chromatic activity; distance failures warn that categorical
      separation may be insufficient
    visual_question: does A read as comfortably scannable, or as flat/indistinguishable?
    visual_judgment: null
    resolution: null
    status: open
  - id: C-busyness-vs-acuity
    candidate: candidate-c-expressive
    metric_signal: highest mean realized chroma, while the nominal area-weighted night model reports slightly
      lower melanopic output than A
    metric_prediction: C is the most chromatic; chroma alone does not predict modeled spectral output
      or sustained attention cost
    visual_question: does C's accent strength aid navigation, or read as busy in call/config-dense files?
    visual_judgment: null
    resolution: null
    status: open
  - id: tag-azure-vs-violet
    candidate: candidate-c-expressive vs a/b
    metric_signal: C moves tag to violet (dH large vs A/B's azure/neutral)
    metric_prediction: cross-candidate dH on tag is large by design
    visual_question: does violet tag help or hurt key-scanning in YAML/JSON?
    visual_judgment: null
    resolution: null
    status: open
  - id: cvd-retention-vs-redundancy
    candidate: all
    metric_signal: some must_distinguish pairs show low CVD retention
    metric_prediction: low retention is compensated by declared redundant channels
    visual_question: do the redundant markers (underline/icon/gutter sign) actually carry the meaning
      under CVD?
    visual_judgment: null
    resolution: null
    status: open
  how_to_use: For each entry, a Phase 7 reviewer fills visual_judgment and resolution. status moves open
    -> confirmed -> resolved.
tradeoffs:
- candidate: candidate-a-restrained
  strategy: restrained
  declared_tradeoffs: 'Lowest chromatic attention hypothesis; weakest categorical cue and smallest CVD
    headroom. Nominal area-weighted spectral output is evaluated separately and is not inferred from chroma.
    Diagnostics are deliberately exempt from the restraint.

    '
  declared_purpose: 'Test whether colour beyond a functional floor adds useful scanning value. Holds chroma
    as low as WCAG floors and the distance matrix tolerate.

    '
  n_total_issues: 459
  n_legibility_issues: 178
  stability_ok: true
  stability_detail:
    material_inversions: 0
    near_tie_flips: 6
    salience_reversals: 0
  max_hue_drift_deg: 5.6
- candidate: candidate-b-balanced
  strategy: balanced
  declared_tradeoffs: 'Categorical scanning should be comfortable; warm-tinted comments and azure-traced
    property are design judgements to be confirmed in Phase 7.

    '
  declared_purpose: 'Baseline hypothesis: semantic colouration with a strong neutral foundation.

    '
  n_total_issues: 426
  n_legibility_issues: 179
  stability_ok: true
  stability_detail:
    material_inversions: 0
    near_tie_flips: 6
    salience_reversals: 0
  max_hue_drift_deg: 5.7
- candidate: candidate-c-expressive
  strategy: expressive
  declared_tradeoffs: 'Strongest categorical/navigation cue; highest chromatic attention hypothesis, and
    the most likely to read as busy in call-dense or config-heavy files. Nominal area-weighted spectral
    output is evaluated separately and is not inferred from chroma. The violet tag shift spends a hue
    A/B keep on azure.

    '
  declared_purpose: 'Test whether stronger unmistakable accents improve scanning enough to justify greater
    attention cost.

    '
  n_total_issues: 391
  n_legibility_issues: 169
  stability_ok: true
  stability_detail:
    material_inversions: 0
    near_tie_flips: 6
    salience_reversals: 0
  max_hue_drift_deg: 5.67
caveats:
- WCAG 2.x ratios are the hard compliance floor; all candidates pass or generation fails (ok=True).
- APCA is independent work in progress, not a W3C Recommendation or current WCAG criterion (R-11).
- CVD models are population-average dichromat simulations; they detect collapse, they do not certify accessibility
  or reproduce an individual's experience (R-9).
- Nominal within-model ranking ONLY. An sRGB triple does not determine a spectral power distribution;
  two displays at the same hex emit different spectra. This never claims actual retinal exposure or a
  circadian/medical effect (RESEARCH.md R-4, R-5). Coverage is a DECLARED estimate, not a screenshot measurement.
- Semantic-identity / distance metrics are reported as diagnostics, not as universal pass/fail thresholds;
  thresholds are not massaged.
- No aggregate score, ranking, winner, or recommendation is produced. Phase 7 (human evaluation) is the
  only part that tests preference.
