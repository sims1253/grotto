stability:
  variants:
  - day
  - evening
  - night
  checks:
  - normalized_chroma_ordering
  - cyclic_family_sequence
  - realized_salience_proxy
  - total_hue_drift_including_adjustments
  normalized_chroma_inversions:
  - roles:
    - keyword
    - string
    variants:
    - day
    - evening
    d1: -0.1485
    d2: 0.0035
  - roles:
    - keyword
    - string
    variants:
    - day
    - night
    d1: -0.1485
    d2: 0.0078
  - roles:
    - keyword
    - number
    variants:
    - day
    - evening
    d1: -0.1485
    d2: 0.0035
  - roles:
    - keyword
    - number
    variants:
    - day
    - night
    d1: -0.1485
    d2: 0.0078
  - roles:
    - keyword
    - constant
    variants:
    - day
    - evening
    d1: -0.1485
    d2: 0.0035
  - roles:
    - keyword
    - constant
    variants:
    - day
    - night
    d1: -0.1485
    d2: 0.0078
  cyclic_family_sequence_preserved: true
  cyclic_family_sequence:
    day:
    - azure
    - violet
    - rose
    - sand
    - sage
    - teal
    evening:
    - azure
    - violet
    - rose
    - sand
    - sage
    - teal
    night:
    - azure
    - violet
    - rose
    - sand
    - sage
    - teal
  salience_proxy_reversals:
  - family: sand
    variant: day
    lower_salience: search_match_current
    higher_salience: debug_current
  - family: sand
    variant: evening
    lower_salience: warning
