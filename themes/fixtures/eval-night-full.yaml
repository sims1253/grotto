# ---------------------------------------------------------------------------
# EVALUATION FIXTURE -- NOT A CANDIDATE PALETTE.
# ---------------------------------------------------------------------------
# This is a machine-readable, perceptual-space-first (OKLCH) placeholder used
# ONLY to exercise Phase 2 evaluation tooling (audit, contrast, distance, CVD,
# spectral, render, report). It is deliberately NOT optimised and is NOT one of
# the project's candidate palettes (those are Phase 5 work). The values are
# round-number stubs chosen to cover every role, every chroma class and every
# hue family so the tooling has something complete to chew on.
#
# `focus` is deliberately pushed past the sRGB gamut boundary to demonstrate
# that the gamut audit flags excursion and reports chroma lost to mapping
# (DESIGN.md section 5: silent clipping is prohibited).
#
# Canonical input form is OKLCH; hex is derived by the loader, which gamut-maps
# to sRGB and records any chroma lost.
# ---------------------------------------------------------------------------

name: grotto-eval-fixture-night-full
variant: night
format: oklch
candidate: false
kind: fixture
note: >
  EVALUATION FIXTURE ONLY. NOT A CANDIDATE PALETTE. Round-number OKLCH
  placeholders covering the full role set; chosen to exercise every metric,
  not to look good or satisfy the distance matrix.

colors:
  # --- neutrals (warm-neutral trace) ---
  bg:               {L: 0.205, C: 0.007, h: 70}
  bg_elevated:      {L: 0.238, C: 0.008, h: 70}
  bg_overlay:       {L: 0.265, C: 0.009, h: 70}
  fg:               {L: 0.860, C: 0.010, h: 90}
  fg_secondary:     {L: 0.700, C: 0.010, h: 90}
  fg_muted:         {L: 0.500, C: 0.010, h: 90}
  comment:          {L: 0.600, C: 0.020, h: 70}
  docstring:        {L: 0.700, C: 0.030, h: 70}
  punctuation:      {L: 0.720, C: 0.000, h: 0}
  operator:         {L: 0.820, C: 0.000, h: 0}
  line_number:      {L: 0.450, C: 0.000, h: 0}
  line_number_active: {L: 0.750, C: 0.000, h: 0}
  ui_inactive:      {L: 0.350, C: 0.000, h: 0}
  active_line:      {L: 0.235, C: 0.010, h: 70}
  parameter:        {L: 0.840, C: 0.010, h: 90}
  property:         {L: 0.820, C: 0.015, h: 245}
