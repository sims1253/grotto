  diff_added:       {L: 0.300, C: 0.040, h: 145}   # sage wash
  diff_removed:     {L: 0.300, C: 0.040, h: 25}    # rose wash
  diff_changed:     {L: 0.300, C: 0.040, h: 80}    # sand wash
  search_match:     {L: 0.500, C: 0.060, h: 80}
