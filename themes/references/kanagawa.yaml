# semantic roles mapped to the wave theme's own ui/syn/diag/vcs/diff tables.
# Every value comes straight from themes.lua `wave = function(palette)`.
roles:
    bg: '#1f1f28'            # ui.bg        = sumiInk3
    bg_elevated: '#2a2a37'   # ui.bg_p1     = sumiInk4 (ColorColumn/Folded/Gutter)
    fg: '#dcd7ba'            # ui.fg        = fujiWhite
    fg_secondary: '#c8c093'  # ui.fg_dim    = oldWhite
    comment: '#727169'       # syn.comment  = fujiGray
    punctuation: '#9cabca'   # syn.punct    = springViolet2
    selection: '#223249'     # ui.bg_visual = waveBlue1
    keyword: '#957fb8'       # syn.keyword  = oniViolet  (also syn.statement)
    string: '#98bb6c'        # syn.string   = springGreen
    number: '#d27e99'        # syn.number   = sakuraPink
    constant: '#ffa066'      # syn.constant = surimiOrange
    type: '#7aa89f'          # syn.type     = waveAqua2
    function: '#7e9cd8'      # syn.fun      = crystalBlue
    builtin: null            # no distinct builtin vs function in the theme
    error: '#e82424'         # diag.error   = samuraiRed
    warning: '#ff9e3b'       # diag.warning = roninYellow
    info: '#658594'          # diag.info    = dragonBlue
    success: '#98bb6c'       # diag.ok      = springGreen (same as string)
    diff_added: '#76946a'    # vcs.added    = autumnGreen
    diff_removed: '#c34043'  # vcs.removed  = autumnRed
