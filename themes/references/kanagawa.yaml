fetched_note: >
  Palette table in lua/kanagawa/colors.lua (all named colors defined there,
  reproduced verbatim below). Semantic roles mapped from the `wave` theme
  function in lua/kanagawa/themes.lua, which assigns palette colors to the
  ui/syn/diag/vcs/diff element tables. NOTE: colors.lua defines colors for all
  three variants in one table: sumi*/wave*/fuji*/oni*/crystal*/spring*/sakura*/
  boat*/carp*/katana* are used by `wave` (dark), dragon* by `dragon` (darker),
  and lotus* by `lotus` (light).

